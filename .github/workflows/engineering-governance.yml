name: Engineering Governance

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'portal/**'
  pull_request:
    paths-ignore:
      - 'portal/**'

jobs:
  governance:
    name: Agent governance
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test script/agent-governance.test.mjs
      - run: node script/agent-governance.mjs check

  swift:
    name: Swift verification
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift run NotchFocusTests
      - run: swift run NotchBridgeParserTests
      - run: swift run NotchMailParserTests
      - run: swift run NotchShelfTests
      - run: swift run NotchSkillsTests
      - run: swift run NotchChatHistoryTests
      - run: swift run NotchScreenShareTests
      - run: swift run NotchGeminiLiveTests
      - run: swift build
