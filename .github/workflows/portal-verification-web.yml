name: Portal Frontend Verification

on:
  push:
    branches:
      - main
    paths:
      - 'portal/web/**'
      - 'portal/contracts/**'
      - '.github/workflows/portal-verification-web.yml'
  pull_request:
    paths:
      - 'portal/web/**'
      - 'portal/contracts/**'
      - '.github/workflows/portal-verification-web.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-web:
    name: Verify Vite React Web
    runs-on: self-hosted
    defaults:
      run:
        working-directory: portal/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Verify Build Compilation
        run: npm run build
