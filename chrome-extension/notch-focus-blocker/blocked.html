<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oops! Focus Time</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <div class="scene">
      <div class="site-info">
        <img id="site-icon" src="" alt="Site Icon" />
        <span id="site-name"></span>
      </div>

      <div class="message">Oops!<br><span class="sub">Time to focus!</span></div>
      
      <div class="runner">
        <div class="blob">
          <div class="sweat"></div>
          <div class="eyes">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="mouth"></div>
          <div class="feet">
            <div class="foot left"></div>
            <div class="foot right"></div>
          </div>
        </div>
        <div class="shadow"></div>
      </div>
    </div>

    <!-- Hidden elements to keep JS working -->
    <div style="display:none;">
      <span id="host"></span>
      <span id="status"></span>
      <span id="phase"></span>
      <h2 id="timer"></h2>
      <button id="retry-button"></button>
      <button id="refresh-button"></button>
      <div id="timer-container"></div>
    </div>

    <script src="blocked.js?v=2"></script>
  </body>
</html>
