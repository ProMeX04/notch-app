name: Portal Verification

on:
  push:
    branches:
      - main
    paths:
      - 'portal/**'
      - '.github/workflows/portal-verification.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/portal-verification.yml'

jobs:
  verify-api:
    name: Verify Go Backend API
    runs-on: self-hosted
    defaults:
      run:
        working-directory: portal/api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: portal/api/go.sum

      - name: Run Tests
        run: go test -v ./...

  verify-web:
    name: Verify Vite React Web
    runs-on: self-hosted
    defaults:
      run:
        working-directory: portal/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Verify Build Compilation
        run: npm run build

