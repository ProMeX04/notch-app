<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis AI Hyper-Reactive Core</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    canvas { display: block; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.95); color: #00aaff; z-index: 100; cursor: pointer;
      text-transform: uppercase; letter-spacing: 3px; font-weight: bold; text-align: center;
    }
  </style>
</head>
<body>
  <div id="overlay">KÍCH HOẠT HỆ THỐNG JARVIS</div>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    const N = 2400;
    const MAX_LINES = 5000;

    let activeState = "idle";
    let stateProgress = { thinking: 0, speaking: 0, listening: 0 };
    let audioInited = false, volume = 0, analyser, dataArray;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 80;

    // --- Particles ---
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const vel = new Float32Array(N * 3);
    const sphereBase = new Float32Array(N * 3);
    const phase = new Float32Array(N);

    for (let i = 0; i < N; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const r = 25; 
      sphereBase[i*3] = r * Math.sin(phi) * Math.cos(theta);
      sphereBase[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      sphereBase[i*3+2] = r * Math.cos(phi);
      pos[i*3] = sphereBase[i*3]; pos[i*3+1] = sphereBase[i*3+1]; pos[i*3+2] = sphereBase[i*3+2];
      phase[i] = Math.random() * 1000;
    }

    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: 0x00aaff, size: 0.45, transparent: true, opacity: 0.8,
      sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const points = new THREE.Points(geo, mat);
    scene.add(points);

    // --- Lines ---
    const lineGeo = new THREE.BufferGeometry();
    const linePos = new Float32Array(MAX_LINES * 6);
    lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3));
    const lineMat = new THREE.LineBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false });
    const lines = new THREE.LineSegments(lineGeo, lineMat);
    scene.add(lines);

    async function initAudio() {
      if (audioInited) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const ac = new AudioContext();
        analyser = ac.createAnalyser();
        const source = ac.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        audioInited = true;
        document.getElementById('overlay').style.display = 'none';
      } catch (e) {}
    }
    document.getElementById('overlay').addEventListener('click', initAudio);

    // --- EFFECT LOGIC ---

    function getSpeakingPos(i, t, vol) {
      // Hyper-Reactive Plasma Core (Bursting energy)
      const i3 = i * 3;
      const nx = sphereBase[i3]/25, ny = sphereBase[i3+1]/25, nz = sphereBase[i3+2]/25;
      
      // Expanding/Contracting with volume peaks
      const baseR = 18 + vol * 30; 
      const noise = Math.sin(t * 10 + i) * (2 + vol * 20); // Spiky noise
      const r = baseR + noise;

      return { x: nx * r, y: ny * r, z: nz * r };
    }

    function getThinkingPos(i, t, vol) {
      // Concentrated Data Cyclone
      const angle = (i / N) * Math.PI * 2 + t * 2.5;
      const r = 14 + (i % 8) * 1.5; // Layered orbits
      return { x: Math.cos(angle) * r, y: Math.sin(angle) * r, z: Math.cos(angle * 0.5) * 5 };
    }

    function getListeningPos(i, t, vol) {
      const i3 = i * 3;
      const nx = sphereBase[i3]/25, ny = sphereBase[i3+1]/25, nz = sphereBase[i3+2]/25;
      const wave = Math.sin(sphereBase[i3] * 0.3 + t * 8) * (4 + vol * 25);
      const r = 26 + wave;
      return { x: nx * r, y: ny * r, z: nz * r };
    }

    let time = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      time = clock.getElapsedTime();

      if (audioInited) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0; for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
        volume = (sum / dataArray.length) / 255;
      }

      const targets = { thinking: 0, speaking: 0, listening: 0 };
      if (activeState !== "idle") targets[activeState] = 1.0;
      for (let k in stateProgress) stateProgress[k] += (targets[k] - stateProgress[k]) * 0.08;

      const pAttr = geo.getAttribute("position");
      const pArr = pAttr.array;

      for (let i = 0; i < N; i++) {
        const i3 = i * 3;
        const sX = sphereBase[i3], sY = sphereBase[i3+1], sZ = sphereBase[i3+2];
        const thi = getThinkingPos(i, time, volume);
        const spe = getSpeakingPos(i, time, volume);
        const lis = getListeningPos(i, time, volume);

        let tx = THREE.MathUtils.lerp(sX, thi.x, stateProgress.thinking);
        let ty = THREE.MathUtils.lerp(sY, thi.y, stateProgress.thinking);
        let tz = THREE.MathUtils.lerp(sZ, thi.z, stateProgress.thinking);

        tx = THREE.MathUtils.lerp(tx, spe.x, stateProgress.speaking);
        ty = THREE.MathUtils.lerp(ty, spe.y, stateProgress.speaking);
        tz = THREE.MathUtils.lerp(tz, spe.z, stateProgress.speaking);

        tx = THREE.MathUtils.lerp(tx, lis.x, stateProgress.listening);
        ty = THREE.MathUtils.lerp(ty, lis.y, stateProgress.listening);
        tz = THREE.MathUtils.lerp(tz, lis.z, stateProgress.listening);

        pArr[i3] += (tx - pArr[i3]) * 0.15;
        pArr[i3+1] += (ty - pArr[i3+1]) * 0.15;
        pArr[i3+2] += (tz - pArr[i3+2]) * 0.15;
      }
      pAttr.needsUpdate = true;

      // Dynamic Lines
      const lArr = lineGeo.getAttribute("position").array;
      let lCount = 0;
      const dLimit = (stateProgress.speaking > 0.5 ? 250 : 100);
      const step = 4;
      for (let i = 0; i < N && lCount < MAX_LINES; i += step) {
        for (let j = i + step; j < N && lCount < MAX_LINES; j += step) {
          const dx = pArr[j*3]-pArr[i*3], dy = pArr[j*3+1]-pArr[i*3+1], dz = pArr[j*3+2]-pArr[i*3+2];
          if (dx*dx + dy*dy + dz*dz < dLimit) {
            const idx = lCount * 6;
            lArr[idx] = pArr[i*3]; lArr[idx+1] = pArr[i*3+1]; lArr[idx+2] = pArr[i*3+2];
            lArr[idx+3] = pArr[j*3]; lArr[idx+4] = pArr[j*3+1]; lArr[idx+5] = pArr[j*3+2];
            lCount++;
          }
        }
      }
      lineGeo.setDrawRange(0, lCount * 2);
      lineGeo.getAttribute("position").needsUpdate = true;
      lineMat.opacity = 0.1 + volume * 0.4 + stateProgress.speaking * 0.3;

      points.rotation.y += 0.005 + volume * 0.05;
      lines.rotation.y = points.rotation.y;

      const g = volume * 0.6 + stateProgress.speaking * 0.2;
      mat.color.setRGB(0.1 + g, 0.6 + g, 1.0);
      camera.position.z = 80 - volume * 20; // Zoom in with volume
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }

    function setEnergyState(s) { activeState = s; }
    window.setEnergyState = setEnergyState;
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();

    const states = ["idle", "listening", "thinking", "speaking"];
    let idx = 0;
    setInterval(() => { idx = (idx + 1) % states.length; setEnergyState(states[idx]); }, 5000);

  </script>
</body>
</html>
