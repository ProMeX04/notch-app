<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notch — Cài đặt</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="layout">
      <header class="top">
        <img src="icons/icon48.png" alt="" class="icon" width="40" height="40" />
        <span class="name">Notch</span>
      </header>

      <section class="card">
        <label for="api-base-url">URL bridge (WebSocket)</label>
        <div class="field-row">
          <input id="api-base-url" type="text" spellcheck="false" autocomplete="off" />
          <button id="save-button" type="button">Lưu</button>
        </div>
        <p class="hint">Mặc định: <code>ws://127.0.0.1:44991/v1/ws</code></p>
      </section>

      <div class="status-toolbar">
        <section id="status-card" class="status status--idle" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <p id="status-text" class="status-text">Đang kiểm tra…</p>
        </section>
        <button id="test-button" class="btn-secondary" type="button">Kiểm tra lại</button>
      </div>

      <p class="foot">
        Chặn site và Focus cấu hình trong <strong>Notch → Cài đặt → Focus</strong>.
      </p>
    </main>

    <script src="bridge-status.js"></script>
    <script src="options.js"></script>
  </body>
</html>
