name: Deploy Portal Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'portal/web/**'
      - 'portal/contracts/**'
      - '.github/workflows/deploy-portal-frontend.yml'

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: self-hosted
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PORTAL_WEB_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci
        working-directory: portal/web

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: portal/web

      - name: Link Vercel env to Vite root
        run: cp .vercel/.env.production.local .env.production.local
        working-directory: portal/web

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: portal/web
        env:
          VITE_SUPABASE_URL: "https://xyhhtghehlzzzpitfveu.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_mXbBCCIKj0Sf0JGFK_4qSA_h8rVZA1j"

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: portal/web
