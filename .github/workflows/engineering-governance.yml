name: Engineering Governance

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'portal/**'
  pull_request:
    paths-ignore:
      - 'portal/**'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  governance:
    name: Agent governance
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test script/agent-governance.test.mjs
      - run: node script/agent-governance.mjs check

  swift:
    name: Swift verification
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: swift test --scratch-path ../swift-build
      - run: swift run --scratch-path ../swift-build NotchFocusTests
      - run: swift run --scratch-path ../swift-build NotchBridgeParserTests
      - run: swift run --scratch-path ../swift-build NotchMailParserTests
      - run: swift run --scratch-path ../swift-build NotchShelfTests
      - run: swift run --scratch-path ../swift-build NotchSkillsTests
      - run: swift run --scratch-path ../swift-build NotchChatHistoryTests
      - run: swift run --scratch-path ../swift-build NotchScreenShareTests
      - run: swift run --scratch-path ../swift-build NotchGeminiLiveTests
      - run: swift build --scratch-path ../swift-build
