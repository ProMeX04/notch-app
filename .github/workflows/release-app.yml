name: Release macOS App

on:
  push:
    tags:
      - 'v*'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Release App
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Homebrew Tap Repo
        uses: actions/checkout@v4
        with:
          repository: promex04/homebrew-tap
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Extract Version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update Info.plist Version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Info.plist

      - name: Build App Bundle
        env:
          RELEASE: 1
          SCRATCH_PATH: ../swift-build
        run: ./build-app.sh

      - name: Create Release ZIP
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "dist/Notch.app" "dist/Notch-$VERSION.zip"
          SHA256=$(shasum -a 256 "dist/Notch-$VERSION.zip" | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/Notch-$VERSION.zip" \
            --repo "ProMeX04/notch-releases" \
            --title "Notch $VERSION" \
            --notes "Release $VERSION"

      - name: Update Homebrew Cask
        run: |
          ruby -0pi -e "gsub(/version \"[^\"]+\"/, 'version \"$VERSION\"'); gsub(/sha256 \"[^\"]+\"/, 'sha256 \"$SHA256\"')" "homebrew-tap/Casks/notch.rb"

      - name: Commit and Push Homebrew Tap Update
        run: |
          git -C homebrew-tap config user.name "GitHub Actions"
          git -C homebrew-tap config user.email "actions@github.com"
          git -C homebrew-tap add Casks/notch.rb
          git -C homebrew-tap commit -m "chore: bump notch to $VERSION"
          git -C homebrew-tap push origin main
